<svg viewBox="0 0 640 240" xmlns="http://www.w3.org/2000/svg" style="width: 100%; height: auto; display: block; margin: 0 auto; max-height: 400px;">
  <style>
    :root {
      --primary: #1E3A8A;
      --secondary: #38BDF8;
      --text-secondary: #6B7280;
    }

    body.dark-mode svg {
      --primary: #38BDF8;
      --secondary: #1E3A8A;
      --text-secondary: #E5E7EB;
    }
  </style>

  <!-- Symbol -->
  <g transform="scale(2)"> <!-- تكبير الرمز لعرض أكبر -->
    <rect x="20" y="20" width="48" height="80" rx="10" fill="var(--primary)"/>
    <rect x="68" y="20" width="64" height="24" rx="10" fill="var(--secondary)"/>
    <rect x="88" y="44" width="24" height="56" rx="10" fill="var(--secondary)"/>
  </g>

  <!-- Wordmark -->
  <text x="320" y="120"
        font-family="Inter, Manrope, IBM Plex Sans, sans-serif"
        font-size="72"
        font-weight="600"
        text-anchor="middle"
        fill="var(--primary)">
    Iram
  </text>

  <text x="320" y="180"
        font-family="Inter, Manrope, IBM Plex Sans, sans-serif"
        font-size="36"
        font-weight="400"
        text-anchor="middle"
        fill="var(--text-secondary)">
    For Technology
  </text>
</svg>
