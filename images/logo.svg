<svg width="400" height="160" viewBox="0 0 400 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .dark-blue { fill: #1E3A8A; }
      .light-blue { fill: #38BDF8; }
      .text-main { font-family: 'Arial', sans-serif; font-weight: bold; fill: #1E3A8A; }
      .text-sub { font-family: 'Arial', sans-serif; fill: #475569; }
    </style>
  </defs>

  <g transform="translate(20, 30)">
    <rect x="0" y="0" width="35" height="90" rx="8" class="dark-blue"/>
    
    <rect x="22" y="0" width="75" height="28" rx="8" class="light-blue"/>
    
    <rect x="42" y="35" width="28" height="55" rx="8" class="light-blue"/>
  </g>

  <g transform="translate(140, 75)">
    <text x="0" y="0" font-size="54" class="text-main">Iram</text>
    
    <text x="0" y="40" font-size="24" font-weight="normal" class="text-sub">For Technology</text>
  </g>
</svg>
